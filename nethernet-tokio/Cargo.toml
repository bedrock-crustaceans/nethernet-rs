[package]
name = "nethernet-tokio"
version = "0.2.0"
edition = "2024"
readme = "../README.md"

[dependencies]
nethernet = { path = "../nethernet" }
tokio = { version = "1.52.3", features = ["net", "sync", "time", "rt-multi-thread", "macros"] }
tracing = "0.1.44"
bytes = "1.11.1"
thiserror = "2.0.17"
url = "2.5.8"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider", "http2", "charset"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring"] }
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"

[dev-dependencies]
tracing-subscriber = "0.3.23"
criterion = "0.8.2"
rand = "0.10.1"

[lib]
bench = false

[[bench]]
name = "nethernet"
harness = false
